# AutoPilot backend stack: blind relay + (optional) registry DB + TURN (future WebRTC) + TLS.
#   cp .env.example .env && edit
#   docker compose up -d --build
name: autopilot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autopilot
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d autopilot"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
    image: autopilot-backend:latest
    restart: unless-stopped
    environment:
      BIND: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://autopilot:${POSTGRES_PASSWORD}@postgres:5432/autopilot
      TRUST_FORWARDED: "1" # only Caddy can reach the backend
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      RELAY_IDLE_SECS: ${RELAY_IDLE_SECS:-120}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend]
    networks: [edge]

  # TURN for the later WebRTC transport (ADR-002). Not used by the v1 Noise-over-WS relay.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    profiles: ["turn"]
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=${DOMAIN}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge:
