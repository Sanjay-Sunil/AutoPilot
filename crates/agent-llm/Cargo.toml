[package]
name = "agent-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-protocol = { version = "0.1.0", path = "../agent-protocol" }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
