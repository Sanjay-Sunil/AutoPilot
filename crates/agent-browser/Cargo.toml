[package]
name = "agent-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-protocol = { version = "0.1.0", path = "../agent-protocol" }
anyhow = "1.0.104"
chromiumoxide = { version = "0.9.1", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time"] }
