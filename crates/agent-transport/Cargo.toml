[package]
name = "agent-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-protocol = { version = "0.1.0", path = "../agent-protocol" }
anyhow = "1.0.104"
base64 = "0.23.1"
blake2 = "0.11.0"
futures-util = "0.3.34"
getrandom = "0.3"
hex = "0.4.3"
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snow = "0.10.0"
subtle = "2.6.1"
tokio = { version = "1.54.0", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }
x25519-dalek = "3.0.0"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
