[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
agent-audit = { version = "0.1.0", path = "../agent-audit" }
agent-browser = { version = "0.1.0", path = "../agent-browser" }
agent-capture = { version = "0.1.0", path = "../agent-capture" }
agent-files = { version = "0.1.0", path = "../agent-files" }
agent-input = { version = "0.1.0", path = "../agent-input" }
agent-llm = { version = "0.1.0", path = "../agent-llm" }
agent-mcp = { version = "0.1.0", path = "../agent-mcp" }
agent-protocol = { version = "0.1.0", path = "../agent-protocol" }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
proptest = "1.11.0"
