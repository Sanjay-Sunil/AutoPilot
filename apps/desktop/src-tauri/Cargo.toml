[package]
name = "autopilot-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AutoPilot tray app: pairing QR, devices, kill switch"
# Built on its own (excluded from the root workspace) so the main workspace does not need webkit.

[lib]
name = "autopilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
